<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mango Jack · Shop (Draft)</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-hero="1">
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <section class="media shade cat-band" aria-label="Collection">
    <img class="bg" id="bandImg" src="assets/kids-beach.jpg" alt="">
    <div class="caption">
      <div><span class="label" id="bandLabel">The launch collection</span><h1 id="shopTitle">Shop all</h1></div>
    </div>
  </section>

  <div class="wrap" style="padding-bottom:clamp(60px,8vw,110px)">
    <nav class="tabs" aria-label="Categories" id="tabs">
      <a href="shop.html#all" data-c="all">All</a>
      <a href="shop.html#tees" data-c="tees">T-shirts</a>
      <a href="shop.html#shorts" data-c="shorts">Shorts</a>
      <a href="shop.html#headwear" data-c="headwear">Headwear</a>
    </nav>
    <div class="shop-bar">
      <span class="small" id="count" aria-live="polite"></span>
      <label><span class="sr">Sort by</span>
        <select id="sort">
          <option value="feat">Featured</option>
          <option value="az">Name A to Z</option>
          <option value="za">Name Z to A</option>
        </select>
      </label>
    </div>
    <div class="pgrid" id="grid"></div>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/site.js"></script>
<script>
{
  const { PRODUCTS, CATS, CAT_LONG, tile } = MJ;
  const BAND = {
    all: ['The launch collection', 'assets/kids-beach.jpg', '50% 40%'],
    tees: ['Fish species tees', 'assets/fish-tees-line.jpg', '50% 45%'],
    shorts: ['Saltwater to sofa', 'assets/film-still.jpg', '50% 50%'],
    headwear: ['Sun on, glare off', 'assets/boat-shirt.jpg', '50% 40%']
  };
  const grid = document.getElementById('grid');
  const sortSel = document.getElementById('sort');
  const render = () => {
    const h = location.hash.slice(1);
    const cat = CATS[h] ? h : 'all';
    let list = cat === 'all' ? PRODUCTS.slice() : PRODUCTS.filter((p) => p.cat === cat);
    if (sortSel.value === 'az') list.sort((a, b) => a.name.localeCompare(b.name));
    if (sortSel.value === 'za') list.sort((a, b) => b.name.localeCompare(a.name));
    // Pepper a relevant on-body look in after every sixth product
    const looks = MJ.LOOKS.filter((l) => l.items.some(([pid]) => list.some((x) => x.id === pid)));
    let li = 0;
    grid.innerHTML = list.map((p, i) => tile(p) + ((i + 1) % 6 === 0 && li < looks.length ? MJ.lookTile(looks[li++], { flat: false }) : '')).join('');
    document.getElementById('shopTitle').textContent = cat === 'all' ? 'Shop all' : CAT_LONG[cat];
    document.getElementById('bandLabel').textContent = BAND[cat][0];
    const img = document.getElementById('bandImg'); img.src = BAND[cat][1]; img.style.objectPosition = BAND[cat][2];
    document.getElementById('count').textContent = list.length + ' product' + (list.length === 1 ? '' : 's');
    document.querySelectorAll('#tabs a').forEach((a) => a.dataset.c === cat ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    document.title = 'Mango Jack · ' + (cat === 'all' ? 'Shop' : CAT_LONG[cat]) + ' (Draft)';
  };
  window.addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0 }); });
  sortSel.addEventListener('change', render);
  render();
}
</script>
</body>
</html>
